{% extends 'base.html' %}

{% block title %}Ingresar — Sistema de Votación{% endblock %}

{% block content %}
  <div class="login-box">
    <h1>Ingresar</h1>
    <p class="lead">Usa tu cuenta para emitir el voto.</p>

    {% if form.errors %}
      <p class="errors">Usuario o contraseña incorrectos.</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div>
        <label for="id_username">Usuario, correo o documento</label>
        <input type="text" name="username" id="id_username" autofocus required>
      </div>

      <div>
        <label for="id_password">Contraseña</label>
        <input type="password" name="password" id="id_password" required>
      </div>

      <button type="submit">Entrar</button>
    </form>

    <p><a href="{% url 'inicio' %}">← Volver al inicio</a></p>
  </div>
{% endblock %}
